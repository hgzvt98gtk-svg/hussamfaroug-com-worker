name: Production benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Measured requests per real page (warmups are additional)
        required: false
        default: '20'
        type: string
      checkpoint:
        description: Report label for a manually triggered run
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - 24h
          - 48h
          - ongoing
  schedule:
    - cron: "0 19 * * *"

concurrency:
  group: production-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      label: ${{ steps.label.outputs.label }}
      timestamp: ${{ steps.label.outputs.timestamp }}
      completed: ${{ steps.measure.outputs.completed }}
      regression: ${{ steps.compare.outputs.regression }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      
      - id: label
        name: Select checkpoint label
        env:
          DISPATCH_LABEL: ${{ inputs.checkpoint }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            LABEL="$(node --input-type=module -e 'import { selectCheckpointLabel } from "./scripts/benchmark-utils.mjs"; console.log(selectCheckpointLabel(new Date()))')"
          else
            LABEL="${DISPATCH_LABEL:-manual}"
          fi
          case "$LABEL" in manual|baseline|24h|48h|ongoing) ;; *) echo "Invalid checkpoint label: $LABEL" >&2; exit 1 ;; esac
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"
          echo "Running benchmark with label: $LABEL"
      
      - id: measure
        name: Measure production pages
        env:
          ITERATIONS: ${{ inputs.iterations || '20' }}
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          mkdir -p out
          node scripts/benchmark-production.mjs \
            --iterations "$ITERATIONS" \
            --label "$LABEL" \
            --output out/current.json
          echo "completed=true" >> "$GITHUB_OUTPUT"
          echo "Measurement complete"
      
      - id: compare
        name: Compare with baseline and write report
        if: always() && steps.measure.outputs.completed == 'true'
        continue-on-error: true
        env:
          LABEL: ${{ steps.label.outputs.label }}
        run: |
          set +e
          PUBLISH_ARGS=()
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            case "$LABEL" in
              24h) PUBLISH_ARGS+=(--publish-report reports/24h-report.md) ;;
              48h) PUBLISH_ARGS+=(--publish-report reports/48h-report.md) ;;
            esac
          fi
          node scripts/compare-benchmarks.mjs \
            --current out/current.json \
            --baseline benchmark-results/page-baseline.json \
            --cloudflare-baseline benchmark-results/baseline.json \
            --output out/comparison.json \
            --report out/report.md \
            "${PUBLISH_ARGS[@]}"
          STATUS=$?
          set -e
          if [ -f out/comparison.json ]; then
            REGRESSION="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).passed ? "false" : "true")' out/comparison.json)"
            echo "regression=$REGRESSION" >> "$GITHUB_OUTPUT"
          fi
          echo "comparison_exit=$STATUS" >> "$GITHUB_OUTPUT"
      
      - name: Add report to step summary
        if: always() && hashFiles('out/report.md') != ''
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-benchmark-${{ steps.label.outputs.label }}-${{ steps.label.outputs.timestamp }}
          path: |
            out/
            benchmark-results/page-baseline.json
            reports/24h-report.md
            reports/48h-report.md
          if-no-files-found: warn
          retention-days: 90
      
      - name: Fail the run on regression
        if: steps.measure.outputs.completed == 'true' && steps.compare.outputs.comparison_exit != '0'
        run: exit 1

  commit-results:
    needs: benchmark
    if: always() && github.event_name == 'schedule' && needs.benchmark.outputs.completed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85 # v4.1.3
        with:
          name: production-benchmark-${{ needs.benchmark.outputs.label }}-${{ needs.benchmark.outputs.timestamp }}
          path: downloaded
      - name: Commit scheduled results without triggering deployment
        env:
          LABEL: ${{ needs.benchmark.outputs.label }}
          TIMESTAMP: ${{ needs.benchmark.outputs.timestamp }}
        run: |
          mkdir -p benchmark-results
          cp downloaded/out/current.json "benchmark-results/${TIMESTAMP}-${LABEL}.json"
          if [ -f downloaded/benchmark-results/page-baseline.json ]; then
            cp downloaded/benchmark-results/page-baseline.json benchmark-results/page-baseline.json
          fi
          for report in 24h-report.md 48h-report.md; do
            if [ -f "downloaded/reports/$report" ]; then cp "downloaded/reports/$report" "reports/$report"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark-results reports
          if git diff --cached --quiet; then
            echo "No benchmark results changed."
          else
            git commit -m "[skip ci] Record production benchmark ($LABEL)"
            for attempt in 1 2 3; do
              if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
                echo "Attempt $attempt: failed to rebase benchmark results onto origin/$GITHUB_REF_NAME." >&2
                git rebase --abort || true
              elif git push; then
                echo "Pushed benchmark results on attempt $attempt."
                break
              else
                echo "Attempt $attempt: failed to push benchmark results to origin/$GITHUB_REF_NAME." >&2
              fi
              if [ "$attempt" = 3 ]; then
                echo "Failed to publish benchmark results after 3 attempts." >&2
                exit 1
              fi
              sleep $((attempt * 5))
            done
          fi

  regression-issue:
    needs: benchmark
    if: always() && github.event_name == 'schedule' && needs.benchmark.outputs.regression == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85 # v4.1.3
        with:
          name: production-benchmark-${{ needs.benchmark.outputs.label }}-${{ needs.benchmark.outputs.timestamp }}
          path: downloaded
      - name: Open or update the regression issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          DATE="$(date -u -d "$RUN_STARTED_AT" +%Y-%m-%d)"
          TITLE="Production benchmark regression ($DATE)"
          {
            echo "Scheduled production benchmark detected a regression."
            echo
            echo "Workflow run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            echo
            cat downloaded/out/report.md
          } > downloaded/issue-body.md
          ISSUE="$(gh issue list --repo "$GH_REPO" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file downloaded/issue-body.md
          else
            ISSUE="$(gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file downloaded/issue-body.md)"
            ISSUE="${ISSUE##*/}"
          fi
          if gh label list --repo "$GH_REPO" --json name --jq '.[].name' | grep -Fxq performance; then
            gh issue edit "$ISSUE" --repo "$GH_REPO" --add-label performance
          fi
